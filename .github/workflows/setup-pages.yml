name: Setup — Make Public & Enable Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  administration: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Make repository public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Attempting to make repository public..."
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO" \
            -d '{"private":false,"visibility":"public"}')
          echo "HTTP status: $HTTP"
          cat /tmp/resp.json | python3 -c "import sys,json; d=json.load(sys.stdin); print('private:', d.get('private'), '| visibility:', d.get('visibility'))" 2>/dev/null || cat /tmp/resp.json

      - name: Enable GitHub Pages (gh-pages branch)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Enabling GitHub Pages..."
          HTTP=$(curl -s -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}')
          echo "HTTP status: $HTTP"
          cat /tmp/pages.json
          # 409 = already enabled, also OK
          if [ "$HTTP" = "201" ] || [ "$HTTP" = "409" ]; then
            echo "Pages enabled!"
          else
            echo "Note: Pages may need manual activation if repo is still private."
          fi
