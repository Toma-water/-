name: Setup — Make Public & Enable Pages

on:
  workflow_dispatch:

permissions:
  contents: write
  pages: write

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - name: Make repository public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Attempting to make repository public..."
          HTTP=$(curl -s -o /tmp/resp.json -w "%{http_code}" -X PATCH \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO" \
            -d '{"private":false,"visibility":"public"}')
          echo "HTTP: $HTTP"
          python3 -c "import json; d=json.load(open('/tmp/resp.json')); print('private:', d.get('private'), '| visibility:', d.get('visibility'))" 2>/dev/null || cat /tmp/resp.json

      - name: Enable GitHub Pages
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          echo "Enabling GitHub Pages on gh-pages branch..."
          HTTP=$(curl -s -o /tmp/pages.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/$REPO/pages" \
            -d '{"source":{"branch":"gh-pages","path":"/"},"build_type":"legacy"}')
          echo "HTTP: $HTTP"
          cat /tmp/pages.json
          [ "$HTTP" = "201" ] || [ "$HTTP" = "409" ] && echo "✅ Pages enabled!" || echo "⚠️ Could not enable Pages (repo may still be private)"
