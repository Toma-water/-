name: Publish to Public URL

on: workflow_dispatch

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Upload and get URL
        run: |
          set +e
          UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36"

          echo "--- trying litterbox.catbox.moe (72h) ---"
          URL=$(curl -s --max-time 30 -A "$UA" \
            -F "reqtype=fileupload" \
            -F "time=72h" \
            -F "fileToUpload=@index.html" \
            https://litterbox.catbox.moe/resources/internals/api.php 2>&1)
          CODE=$?
          echo "exit=$CODE response=$URL"
          if [ $CODE -eq 0 ] && echo "$URL" | grep -qE '^https?://'; then
            echo "============================================"
            echo "アプリのURL (72時間有効):"
            echo "$URL"
            echo "============================================"
            exit 0
          fi

          echo "--- trying uguu.se (24h) ---"
          RESP=$(curl -s --max-time 30 -A "$UA" \
            -F "files[]=@index.html;type=text/html" \
            https://uguu.se/upload.php 2>&1)
          CODE=$?
          echo "exit=$CODE response=$RESP"
          URL=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['files'][0]['url'])" 2>/dev/null || true)
          if [ -n "$URL" ] && echo "$URL" | grep -qE '^https?://'; then
            echo "============================================"
            echo "アプリのURL (uguu.se / 24時間):"
            echo "$URL"
            echo "============================================"
            exit 0
          fi

          echo "--- trying pomf.cat ---"
          RESP=$(curl -s --max-time 30 -A "$UA" \
            -F "files[]=@index.html;type=text/html" \
            https://pomf.cat/upload.php 2>&1)
          CODE=$?
          echo "exit=$CODE response=$RESP"
          URL=$(echo "$RESP" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d['files'][0]['url'])" 2>/dev/null || true)
          if [ -n "$URL" ] && echo "$URL" | grep -qE '^https?://'; then
            echo "============================================"
            echo "アプリのURL (pomf.cat):"
            echo "$URL"
            echo "============================================"
            exit 0
          fi

          echo "All upload services failed."
          exit 1
