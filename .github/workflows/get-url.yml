name: Publish to Public URL

on: workflow_dispatch

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout gh-pages
        uses: actions/checkout@v4
        with:
          ref: gh-pages

      - name: Upload and get URL
        run: |
          set +e
          echo "--- trying 0x0.st ---"
          URL=$(curl -s --max-time 20 -F "file=@index.html" https://0x0.st 2>&1)
          CODE=$?
          echo "exit=$CODE response=$URL"
          if [ $CODE -eq 0 ] && echo "$URL" | grep -qE '^https?://'; then
            echo "============================================"
            echo "アプリのURL (0x0.st):"
            echo "$URL"
            echo "============================================"
            exit 0
          fi

          echo "--- trying catbox.moe ---"
          URL=$(curl -s --max-time 20 -F "reqtype=fileupload" -F "fileToUpload=@index.html" https://catbox.moe/user/api.php 2>&1)
          CODE=$?
          echo "exit=$CODE response=$URL"
          if [ $CODE -eq 0 ] && echo "$URL" | grep -qE '^https?://'; then
            echo "============================================"
            echo "アプリのURL (catbox.moe):"
            echo "$URL"
            echo "============================================"
            exit 0
          fi

          echo "--- trying bashupload.com ---"
          URL=$(curl -s --max-time 20 --upload-file index.html https://bashupload.com/DailyInquiryLog.html 2>&1)
          CODE=$?
          echo "exit=$CODE response=$URL"
          LINK=$(echo "$URL" | grep -oE 'https?://[^ ]+' | head -1)
          if [ $CODE -eq 0 ] && [ -n "$LINK" ]; then
            echo "============================================"
            echo "アプリのURL (bashupload.com):"
            echo "$LINK"
            echo "============================================"
            exit 0
          fi

          echo "All upload services failed."
          exit 1
