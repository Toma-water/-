<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>接続確認 — Daily Inquiry Log</title>
  <style>
    body { font-family: sans-serif; display: flex; align-items: center; justify-content: center;
           height: 100vh; margin: 0; background: #f0fdf4; }
    .box { text-align: center; padding: 40px; background: white; border-radius: 16px;
           box-shadow: 0 4px 16px rgba(0,0,0,.1); max-width: 320px; }
    .icon { font-size: 64px; }
    h1 { color: #16a34a; margin: 16px 0 8px; font-size: 1.4rem; }
    p { color: #475569; font-size: 0.95rem; line-height: 1.6; }
    .url { font-size: 0.8rem; color: #94a3b8; margin-top: 16px; word-break: break-all; }
    a { display: inline-block; margin-top: 20px; padding: 12px 28px; background: #2563eb;
        color: white; border-radius: 8px; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">✅</div>
    <h1>接続 OK！</h1>
    <p>サーバーとスマホが正常に通信できています。</p>
    <a href="/">アプリを開く</a>
    <p class="url" id="url"></p>
  </div>
  <script>document.getElementById('url').textContent = location.href;</script>
</body>
</html>
